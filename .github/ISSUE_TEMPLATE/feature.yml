name: Feature / task
description: A unit of work (one issue = one branch = one PR)
labels: ["type:feature"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check anyone can run to confirm it works.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Context, links, open questions.
