version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js:
        patterns: ["*"]
    # The Expo SDK pins these; upgrade them with `npx expo install --fix` instead.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "typescript"
      - dependency-name: "jest"
      - dependency-name: "@types/jest"
      # eslint-plugin-react (via eslint-config-expo) doesn't support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # NativeWind v4 (ADR 0005) needs Tailwind 3. Its css-interop is covered by react-native-*.
      - dependency-name: "nativewind"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
