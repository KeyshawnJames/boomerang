[project]
name = "boomerang-backend"
version = "0.1.0"
description = "Boomerang FastAPI backend — on-demand returns marketplace"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.42",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The alembic/ migrations folder would otherwise make ruff treat the alembic package as ours.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
