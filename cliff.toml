# git-cliff config: generates CHANGELOG.md from Conventional Commit titles on main.
# Run once per milestone, in a `chore(release): mN` PR branched from fresh main:
#   git cliff --tag mN -o CHANGELOG.md     (then tag mN on main after merge)
# Not run on feature branches: squash-merge rewrites their hashes.
[changelog]
header = "# Changelog\n\nGenerated from commit history by [git-cliff](https://git-cliff.org). Do not edit by hand; the human story is in `docs/JOURNAL.md`.\n\n"
body = """
{% if version %}## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!--0-->Features" },
  { message = "^fix", group = "<!--1-->Fixes" },
  { message = "^docs", group = "<!--2-->Docs" },
  { message = "^refactor", group = "<!--3-->Refactors" },
  { message = "^test", group = "<!--4-->Tests" },
  { message = "^(chore|ci|build)", group = "<!--5-->Chores" },
]
sort_commits = "newest"
tag_pattern = "m[0-9]+"
